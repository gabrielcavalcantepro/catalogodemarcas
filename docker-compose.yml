services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xperformance
      POSTGRES_PASSWORD: xperformance
      POSTGRES_DB: xperformance
    ports:
      - "5434:5432"
    volumes:
      - xp_db_data:/var/lib/postgresql/data

volumes:
  xp_db_data:
